{% extends 'base.html' %}

{% block content %}

<h2>Liste des expeditions</h2>

<table border="1">
    <thead>
        <tr>
            <th>Reference</th>
            <th>Adresse</th>
            <th>Statut</th>
        </tr>
    </thead>

    <tbody>
        {% for expedition in expeditions %}
        <tr>
            <td> <a href="{% url 'expedition:detail_exped' expedition.reference %}">{{ expedition.reference|lower }} </a> </td>
            <td>{{ expedition.adresse }}</td>
            <td>{{ expedition.statut}}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="4">No expeditions were found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
