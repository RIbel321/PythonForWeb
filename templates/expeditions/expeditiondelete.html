{% extends 'base.html' %}

{% block content %}

<h2>Supprimer l'expédition</h2>

<p>Êtes-vous sûr de vouloir supprimer l'expédition : <strong>{{ expedition.reference }}</strong> ?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Delete, are you sure?</button>
</form>

<p>
    <a href="{% url 'expedition:list_exped' %}">Annuler</a>
</p>

{% endblock %}
